name: Windows build and PDF integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the included app without installing an SDK
        shell: pwsh
        run: ./scripts/test-portable.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test native PDF editing
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Test Windows interface
        shell: pwsh
        run: ./scripts/test-ui.ps1
      - name: Package Windows app
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DirectPDF-win-x64
          path: artifacts/DirectPDF-win-x64-framework-dependent.zip
